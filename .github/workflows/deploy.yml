################################################################################
# deploy.yml
# GitHub Actions Workflow for deploying pcollections to PyPI.
# by Noah C. Benson
#
# Wheel builds are handled by cibuildwheel; Python 3.7--3.12.
#
# Wheel targets:
#  - Linux:
#     - x86_64  - CPython 3.7-3.12
#     - i686    - CPython 3.7-3.12
#     - aarch64 - CPython 3.7-3.12
#  - Windows:
#     - AMD64 - CPython 3.7-3.12
#     - x86   - CPython 3.7-3.12
#     - ARM64 - CPython 3.9-3.12
#  - macOS:
#     - x86_64 - CPython 3.7-3.12
#     - arm64  - CPython 3.8-3.12


name: Deploy to PyPI

# We only run this manually.
on:
  workflow_dispatch:

jobs:
  deploy-source:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Run tests
        run: |
          python -m pip install .
          cd ~
          python -m unittest phamt.test
      - name: Build source distribution
        run: |
          python -m build --sdist
      - name: Upload source distribution
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload --skip-existing dist/phamt-*.tar.gz

  deploy-wheels:
    name: Wheel - ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux x86_64 / i686
            os: ubuntu-latest
            archs: x86_64 i686
            build: >-
              cp37-* cp38-* cp39-* cp310-* cp311-* cp312-*
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            archs: aarch64
            build: >-
              cp37-* cp38-* cp39-* cp310-* cp311-* cp312-*
          - name: Windows AMD64 / x86
            os: windows-latest
            archs: AMD64 x86
            build: >-
              cp37-* cp38-* cp39-* cp310-* cp311-* cp312-*
          - name: Windows ARM64
            os: windows-11-arm
            archs: ARM64
            build: >-
              cp39-* cp310-* cp311-* cp312-*
          - name: macOS Intel
            os: macos-15-intel
            archs: x86_64
            build: >-
              cp37-* cp38-* cp39-* cp310-* cp311-* cp312-*
          - name: macOS ARM64
            os: macos-14
            archs: arm64
            build: >-
              cp38-* cp39-* cp310-* cp311-* cp312-*
    env:
      CIBW_BUILD: ${{ matrix.build }}
      CIBW_ARCHS: ${{ matrix.archs }}
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
      CIBW_MANYLINUX_I686_IMAGE: manylinux2014
      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      CIBW_TEST_COMMAND: >-
        python -m unittest phamt.test
      CIBW_BUILD_VERBOSITY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        with:
          output-dir: wheelhouse
      - name: List generated wheels
        shell: bash
        run: |
          echo "Generated wheels:"
          ls -lh wheelhouse/
      - name: Install Twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine
      - name: Upload wheels to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload --skip-existing wheelhouse/*.whl
